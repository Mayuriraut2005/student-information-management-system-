# Netlify Configuration for Presentation Tier

[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# SPA / Clean URL fallbacks
[[redirects]]
  from = "/students"
  to = "/students.html"
  status = 200

[[redirects]]
  from = "/add-student"
  to = "/add-student.html"
  status = 200

[[redirects]]
  from = "/edit-student"
  to = "/edit-student.html"
  status = 200
